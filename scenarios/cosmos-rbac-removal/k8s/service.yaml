# Service exposing the Cosmos RBAC Removal deployment via an Azure Load Balancer.
# External traffic on port 80 is forwarded to the app containers on port 3000.
apiVersion: v1
kind: Service
metadata:
  name: cosmos-rbac-removal-app
  namespace: cosmos-rbac-removal
  labels:
    app: cosmos-rbac-removal-app
spec:
  type: LoadBalancer
  selector:
    app: cosmos-rbac-removal-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
