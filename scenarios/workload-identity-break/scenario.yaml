id: workload-identity-break
title: Workload Identity Break
platform: Azure Kubernetes Service
incidentType: Workload identity authentication failure
summary: The workload's federated identity credential is deleted, so pods cannot acquire an AAD token and /items returns HTTP 500 with auth errors while /health stays green.
severity: 3
estimatedMinutes: 30
difficulty: advanced
costProfile: high
learningObjectives:
  - Distinguish authentication (token acquisition) failures from authorization (RBAC) failures.
  - Trace AADSTS70021 / "No matching federated identity" errors in ContainerLogV2 to a missing federated identity credential.
  - Reconcile a missing federated identity credential by restoring the federatedCredential block in identity.bicep via a GitHub issue / @copilot PR (GitOps), with a manual fallback.
guide: README.md
setup:
  bash: scripts/setup.sh
  powershell: scripts/setup.ps1
signal:
  alertModule: infra/bicep/modules/alert.bicep
  alertName: workload-identity-auth-errors
inject:
  bash: scripts/inject.sh
  powershell: scripts/inject.ps1
validate:
  bash: scripts/validate.sh
  powershell: scripts/validate.ps1
cleanup:
  bash: scripts/cleanup.sh
  powershell: scripts/cleanup.ps1
remediate:
  - action: restore-federated-credential
    bash: scripts/remediate.sh
    powershell: scripts/remediate.ps1
    description: Recreate the federated identity credential binding the workload-identity-break-app ServiceAccount to the UAMI, and restart pods.
investigation:
  query: investigation/query.kql
source: src/app
