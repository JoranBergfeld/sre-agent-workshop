server {
    listen 8080;
    listen [::]:8080;
    root /home/site/wwwroot;
    index index.php;
    server_name _;
    location / {
        try_files $uri /index.php?$query_string;
    }
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 75s;
    }
    location ~ /\.(?!well-known) {
        deny all;
    }
    location ~* \.(json|conf)$ {
        deny all;
    }
}
