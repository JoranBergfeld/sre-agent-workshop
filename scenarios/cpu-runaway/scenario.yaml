id: cpu-runaway
title: CPU Runaway
platform: Azure Virtual Machines
incidentType: Compute saturation
summary: A runaway process pegs CPU above 85%, starving the IIS workload of compute.
severity: 3
estimatedMinutes: 20
difficulty: beginner
costProfile: high
learningObjectives:
  - Identify sustained high CPU from Azure Monitor Perf counters.
  - Stop the offending process through the approval gate.
guide: README.md
setup:
  bash: scripts/setup.sh
  powershell: scripts/setup.ps1
signal:
  alertModule: infra/bicep/modules/alert.bicep
  alertName: vm-cpu-runaway
inject:
  bash: scripts/inject.sh
  powershell: scripts/inject.ps1
validate:
  bash: scripts/validate.sh
  powershell: scripts/validate.ps1
cleanup:
  bash: scripts/cleanup.sh
  powershell: scripts/cleanup.ps1
remediate:
  - action: stop-cpu-runaway
    bash: scripts/remediation/stop-cpu-runaway.sh
    powershell: scripts/remediation/stop-cpu-runaway.ps1
    description: Stop the runaway CPU process.
investigation:
  query: investigation/query.kql
tests: tests
