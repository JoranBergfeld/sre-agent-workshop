name: Validate Azure Boards Copilot Handover Application

on:
  # Dispatch with a branch or tag (--ref), never a raw commit SHA.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scenarios/azure-boards-copilot-handover/app/**'
      - 'scenarios/azure-boards-copilot-handover/CODE_QUALITY.md'
      - 'scripts/build-artifacts/**'
      - '.github/workflows/validate-azure-boards-copilot-handover-app.yml'
  pull_request:
    paths:
      - 'scenarios/azure-boards-copilot-handover/app/**'
      - 'scenarios/azure-boards-copilot-handover/CODE_QUALITY.md'
      - 'scripts/build-artifacts/**'
      - '.github/workflows/validate-azure-boards-copilot-handover-app.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scenarios/azure-boards-copilot-handover/app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scenarios/azure-boards-copilot-handover/app/requirements*.txt

      - name: Install quality dependencies
        run: pip install -r requirements-dev.txt

      - name: Check formatting
        run: ruff format --check .

      - name: Lint application
        run: ruff check .

      - name: Check static types
        run: mypy

      - name: Run baseline tests with branch coverage
        run: |
          pytest --cov=order_events --cov-report=term-missing
          coverage report --include='order_events/normalizer/*' --fail-under=100

      - name: Verify the repair acceptance suite is intentionally red
        shell: bash
        run: |
          set -euo pipefail

          set +e
          pytest -m repair 2>&1 | tee repair-output.txt
          repair_status="${PIPESTATUS[0]}"
          set -e

          expected_failures="$(
            grep -cF \
              "E       order_events.normalizer.errors.UnsupportedReceiptSchemaError: schemaVersion 'v2' is not supported" \
              repair-output.txt \
              || true
          )"

          if [[ "$repair_status" -eq 0 ]]; then
            exit 0
          fi

          if [[ "$repair_status" -ne 1 ]] ||
             [[ "$expected_failures" -ne 3 ]] ||
             ! grep -Eq '^=+ 3 failed, [0-9]+ deselected in [0-9.]+s =+$' \
               repair-output.txt; then
            echo "::error::The repair suite must fail only for the three intentionally unsupported v2 events."
            exit 1
          fi

      - name: Test artifact packaging
        working-directory: .
        run: python -m unittest discover -s scripts/build-artifacts -p 'test_*.py'

      - name: Package Linux Python 3.12 Functions application
        if: github.event_name != 'pull_request'
        working-directory: .
        run: |
          python -m pip install \
            --requirement scenarios/azure-boards-copilot-handover/app/requirements.txt \
            --target "$RUNNER_TEMP/functions-dependencies" \
            --platform manylinux2014_x86_64 --implementation cp --python-version 3.12 --abi cp312 \
            --only-binary=:all: --no-compile
          python scripts/build-artifacts/artifact.py functions \
            --source scenarios/azure-boards-copilot-handover/app \
            --dependencies "$RUNNER_TEMP/functions-dependencies" \
            --source-sha "$GITHUB_SHA" \
            --output dist/boards/application/deployment.zip
          python scripts/build-artifacts/artifact.py metadata \
            --scenario azure-boards-copilot-handover --variant application \
            --archive dist/boards/application/deployment.zip --output dist/boards/application/metadata.json

      - name: Smoke test packaged Functions imports
        if: github.event_name != 'pull_request'
        working-directory: .
        run: |
          python -m zipfile -e dist/boards/application/deployment.zip "$RUNNER_TEMP/functions-smoke"
          cd "$RUNNER_TEMP/functions-smoke"
          PYTHONPATH="$PWD/.python_packages/lib/site-packages" python -c \
            'import os, function_app; assert len(function_app.app.get_functions()) == 4; assert function_app.PACKAGE_COMMIT_SHA == os.environ["GITHUB_SHA"]'

      - name: Upload exact-source deployment artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: azure-boards-copilot-handover-application-${{ github.sha }}
          path: dist/boards/application/*
          if-no-files-found: error
