name: Deploy Workload Identity Break Infrastructure

on:
  workflow_dispatch:
    inputs:
      location:
        description: 'Preferred Azure region (fallback order: infra/placement.json)'
        type: choice
        options:
          - eastus2
          - swedencentral
          - australiaeast
        default: eastus2
      regionFallback:
        description: 'Fall back to the next supported region when the preferred one lacks capacity, SKUs or quota (never for an existing deployment)'
        type: boolean
        default: true
      workloadName:
        description: 'Workload name (used in resource naming)'
        type: string
        default: srelabidentity

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SCENARIO_ROOT: scenarios/workload-identity-break
      LOCATION: ${{ inputs.location || vars.AZURE_LOCATION || 'eastus2' }}
      WORKLOAD: ${{ inputs.workloadName || vars.WORKLOAD_NAME || 'srelabidentity' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Node.js for the placement engine
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy Bicep template (region and SKU fallback)
        id: deploy
        env:
          REGION_FALLBACK: ${{ inputs.regionFallback && 'true' || 'false' }}
        run: |
          # Placement policy: scenarios/workload-identity-break/infra/placement.json. An existing
          # resource group stays pinned to its recorded region; only verified
          # attempt-owned resources are cleaned up after a failed attempt.
          fallback=()
          if [ "${REGION_FALLBACK}" != "true" ]; then fallback=(--no-region-fallback); fi
          node scripts/placement/provision.mjs deploy workload-identity-break \
            --location "${LOCATION}" "${fallback[@]}" \
            --workload "${WORKLOAD}" \
            --outputs-file deployment-outputs.json

          cat deployment-outputs.json

          echo "aks_name=$(jq -r '.aksClusterName.value' deployment-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "cosmos_endpoint=$(jq -r '.cosmosDbEndpoint.value' deployment-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "uami_client_id=$(jq -r '.uamiClientId.value' deployment-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "law_id=$(jq -r '.logAnalyticsWorkspaceId.value' deployment-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "appinsights_cs=$(jq -r '.appInsightsConnectionString.value' deployment-outputs.json)" >> "$GITHUB_OUTPUT"

      - name: Print deployment summary
        run: |
          echo "============================================"
          echo "  Workload Identity Break Infrastructure Complete"
          echo "============================================"
          echo "Resource Group:      ${{ steps.deploy.outputs.resource_group }}"
          echo "Location:            ${{ steps.deploy.outputs.location }}"
          echo "AKS node size:       ${{ steps.deploy.outputs.sku }}"
          echo "AKS Cluster:         ${{ steps.deploy.outputs.aks_name }}"
          echo "CosmosDB Endpoint:   ${{ steps.deploy.outputs.cosmos_endpoint }}"
          echo "UAMI Client ID:      ${{ steps.deploy.outputs.uami_client_id }}"
          echo "Log Analytics ID:    ${{ steps.deploy.outputs.law_id }}"
          echo "App Insights CS:     ${{ steps.deploy.outputs.appinsights_cs }}"
          echo "Scenario guide:      ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/scenarios/workload-identity-break/README.md"
          echo "Next: Run 'Deploy Workload Identity Break Application' and follow scenarios/workload-identity-break/README.md."
          echo "============================================"
