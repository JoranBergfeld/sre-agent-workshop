name: Deploy IIS App Pool Infrastructure

on:
  workflow_dispatch:
    inputs:
      location:
        description: 'Azure region'
        type: choice
        options:
          - eastus2
          - swedencentral
          - australiaeast
        default: eastus2
      workloadName:
        description: 'Workload name (used in resource naming)'
        type: string
        default: srelabiisapppool
      adminUsername:
        description: 'Windows VM admin username'
        type: string
        default: azureuser

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SCENARIO_ROOT: scenarios/iis-app-pool
      LOCATION: ${{ inputs.location || vars.AZURE_LOCATION || 'eastus2' }}
      WORKLOAD: ${{ inputs.workloadName || vars.WORKLOAD_NAME || 'srelabiisapppool' }}
      ADMIN_USERNAME: ${{ inputs.adminUsername || 'azureuser' }}
      ADMIN_PASSWORD: ${{ secrets.VM_ADMIN_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate VM admin password secret
        run: |
          if [ -z "${ADMIN_PASSWORD}" ]; then
            echo "::error::Missing repository secret VM_ADMIN_PASSWORD"
            exit 1
          fi

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create resource group
        run: |
          az group create \
            --name "rg-${{ env.WORKLOAD }}" \
            --location "${{ env.LOCATION }}" \
            --tags scenario=iis-app-pool environment=demo

      - name: Deploy IIS App Pool Bicep template
        id: deploy
        run: |
          az deployment group create \
            --resource-group "rg-${{ env.WORKLOAD }}" \
            --template-file "${{ env.SCENARIO_ROOT }}/infra/bicep/main.bicep" \
            --parameters "${{ env.SCENARIO_ROOT }}/infra/bicep/main.bicepparam" \
              location="${{ env.LOCATION }}" \
              workloadName="${{ env.WORKLOAD }}" \
              adminUsername="${{ env.ADMIN_USERNAME }}" \
              adminPassword="${{ env.ADMIN_PASSWORD }}" \
              tags='{"scenario":"iis-app-pool","environment":"demo"}' \
            --query 'properties.outputs' \
            -o json > deployment-outputs.json

          cat deployment-outputs.json
          echo "vm_names=$(jq -rc '.vmNames.value' deployment-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "vm_private_ips=$(jq -rc '.vmPrivateIps.value' deployment-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "law_id=$(jq -r '.logAnalyticsWorkspaceId.value' deployment-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "bastion_name=$(jq -r '.bastionName.value' deployment-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "operations_identity_client_id=$(jq -r '.operationsIdentityClientId.value' deployment-outputs.json)" >> "$GITHUB_OUTPUT"

      - name: Print IIS App Pool deployment summary
        run: |
          echo "=================================================="
          echo "  IIS App Pool Infrastructure Deployment Complete"
          echo "=================================================="
          echo "Resource Group:                 rg-${{ env.WORKLOAD }}"
          echo "Location:                       ${{ env.LOCATION }}"
          echo "VM Names:                       ${{ steps.deploy.outputs.vm_names }}"
          echo "VM Private IPs:                 ${{ steps.deploy.outputs.vm_private_ips }}"
          echo "Bastion Host:                   ${{ steps.deploy.outputs.bastion_name }}"
          echo "Log Analytics Workspace ID:     ${{ steps.deploy.outputs.law_id }}"
          echo "Operations Identity Client ID:  ${{ steps.deploy.outputs.operations_identity_client_id }}"
          echo "Scenario guide:                 ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/scenarios/iis-app-pool/README.md"
          echo "Next: Follow scenarios/iis-app-pool/README.md."
          echo "=================================================="
