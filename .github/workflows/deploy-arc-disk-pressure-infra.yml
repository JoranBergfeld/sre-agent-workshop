name: Deploy Arc Disk Pressure Infrastructure

on:
  workflow_dispatch:
    inputs:
      location:
        description: 'Preferred Azure region (fallback order: infra/placement.json)'
        type: choice
        options: [eastus2, swedencentral, australiaeast]
        default: eastus2
      regionFallback:
        description: 'Fall back to the next supported region when the preferred one lacks capacity, SKUs or quota (never for an existing deployment)'
        type: boolean
        default: true
      workloadName:
        description: 'Workload name (used in resource naming)'
        type: string
        default: srelabarcdisk
      adminUsername:
        description: 'Windows VM admin username'
        type: string
        default: azureuser

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SCENARIO_ROOT: scenarios/arc-disk-pressure
      LOCATION: ${{ inputs.location || vars.AZURE_LOCATION || 'eastus2' }}
      WORKLOAD: ${{ inputs.workloadName || vars.WORKLOAD_NAME || 'srelabarcdisk' }}
      ADMIN_USERNAME: ${{ inputs.adminUsername || 'azureuser' }}
      ADMIN_PASSWORD: ${{ secrets.VM_ADMIN_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Windows admin password secret
        run: |
          if [ -z "$ADMIN_PASSWORD" ]; then
            echo "::error::Missing repository secret VM_ADMIN_PASSWORD"
            exit 1
          fi

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Node.js for the placement engine
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy Arc disk-pressure infrastructure (region and SKU fallback)
        id: deploy
        env:
          REGION_FALLBACK: ${{ inputs.regionFallback && 'true' || 'false' }}
        run: |
          # Placement policy: scenarios/arc-disk-pressure/infra/placement.json. An existing
          # resource group stays pinned to its recorded region; only verified
          # attempt-owned resources are cleaned up after a failed attempt.
          fallback=()
          if [ "${REGION_FALLBACK}" != "true" ]; then fallback=(--no-region-fallback); fi
          node scripts/placement/provision.mjs deploy arc-disk-pressure \
            --location "${LOCATION}" "${fallback[@]}" \
            --workload "${WORKLOAD}" \
            --param adminUsername="${ADMIN_USERNAME}" \
            --secure-param-env adminPassword=ADMIN_PASSWORD \
            --outputs-file arc-disk-pressure-deployment-outputs.json

          cat arc-disk-pressure-deployment-outputs.json

      - name: Print deployment summary
        run: |
          echo "Arc disk-pressure infrastructure deployed"
          echo "Resource group: ${{ steps.deploy.outputs.resource_group }}"
          echo "Location: ${{ steps.deploy.outputs.location }}"
          echo "VM size: ${{ steps.deploy.outputs.sku }}"
          echo "Scenario guide: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/scenarios/arc-disk-pressure/README.md"
