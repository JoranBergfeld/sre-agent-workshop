name: Deploy Arc Disk Pressure Infrastructure

on:
  workflow_dispatch:
    inputs:
      location:
        description: 'Azure region'
        type: choice
        options: [eastus2, swedencentral, australiaeast]
        default: eastus2
      workloadName:
        description: 'Workload name (used in resource naming)'
        type: string
        default: srelabarcdisk
      adminUsername:
        description: 'Windows VM admin username'
        type: string
        default: azureuser

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SCENARIO_ROOT: scenarios/arc-disk-pressure
      LOCATION: ${{ inputs.location || vars.AZURE_LOCATION || 'eastus2' }}
      WORKLOAD: ${{ inputs.workloadName || vars.WORKLOAD_NAME || 'srelabarcdisk' }}
      ADMIN_USERNAME: ${{ inputs.adminUsername || 'azureuser' }}
      ADMIN_PASSWORD: ${{ secrets.VM_ADMIN_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Windows admin password secret
        run: |
          if [ -z "$ADMIN_PASSWORD" ]; then
            echo "::error::Missing repository secret VM_ADMIN_PASSWORD"
            exit 1
          fi

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create resource group
        run: |
          az group create \
            --name "rg-$WORKLOAD" \
            --location "$LOCATION" \
            --tags scenario=arc-disk-pressure environment=demo

      - name: Deploy Arc disk-pressure infrastructure
        run: |
          az deployment group create \
            --resource-group "rg-$WORKLOAD" \
            --template-file "$SCENARIO_ROOT/infra/bicep/main.bicep" \
            --parameters "$SCENARIO_ROOT/infra/bicep/main.bicepparam" \
              location="$LOCATION" \
              workloadName="$WORKLOAD" \
              adminUsername="$ADMIN_USERNAME" \
              adminPassword="$ADMIN_PASSWORD" \
              tags='{"scenario":"arc-disk-pressure","environment":"demo"}' \
            --query properties.outputs \
            -o json > arc-disk-pressure-deployment-outputs.json

          cat arc-disk-pressure-deployment-outputs.json

      - name: Print deployment summary
        run: |
          echo "Arc disk-pressure infrastructure deployed"
          echo "Resource group: rg-$WORKLOAD"
          echo "Scenario guide: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/scenarios/arc-disk-pressure/README.md"
