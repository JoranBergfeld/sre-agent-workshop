name: Deploy VM Size Retirement Infrastructure

on:
  workflow_dispatch:
    inputs:
      location:
        description: 'Preferred Azure region (fallback order: infra/placement.json)'
        type: choice
        options:
          - eastus2
          - swedencentral
          - australiaeast
        default: eastus2
      regionFallback:
        description: 'Fall back to the next supported region when the preferred one lacks capacity, SKUs or quota (never for an existing deployment)'
        type: boolean
        default: true
      workloadName:
        description: 'Workload name used in resource naming'
        type: string
        default: srelabretirement
      adminUsername:
        description: 'Windows VM admin username'
        type: string
        default: azureuser
      sreAgentPrincipalId:
        description: 'Object (principal) ID of the Azure SRE Agent managed identity to grant least-privilege investigation access'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      LOCATION: ${{ inputs.location }}
      WORKLOAD: ${{ inputs.workloadName }}
      ADMIN_USERNAME: ${{ inputs.adminUsername }}
      ADMIN_PASSWORD: ${{ secrets.VM_ADMIN_PASSWORD }}
      SRE_AGENT_PRINCIPAL_ID: ${{ inputs.sreAgentPrincipalId }}
      RESOURCE_GROUP: rg-${{ inputs.workloadName }}
      SCENARIO_README: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/scenarios/vm-size-retirement/README.md
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate deployment credentials and SRE Agent principal
        run: |
          if [ -z "${ADMIN_PASSWORD}" ]; then
            echo "::error::Missing repository secret VM_ADMIN_PASSWORD"
            exit 1
          fi
          if [ -z "${SRE_AGENT_PRINCIPAL_ID}" ]; then
            echo "::error::sreAgentPrincipalId must be the object (principal) ID of the Azure SRE Agent managed identity"
            exit 1
          fi

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Node.js for the placement engine
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy VM infrastructure (region and SKU fallback)
        id: deploy
        env:
          REGION_FALLBACK: ${{ inputs.regionFallback && 'true' || 'false' }}
        run: |
          # Placement policy: scenarios/vm-size-retirement/infra/placement.json. An existing
          # resource group stays pinned to its recorded region. A failed attempt is
          # retried elsewhere only after it is verified to have changed nothing;
          # nothing is ever deleted automatically.
          fallback=()
          if [ "${REGION_FALLBACK}" != "true" ]; then fallback=(--no-region-fallback); fi
          node scripts/placement/provision.mjs deploy vm-size-retirement \
            --location "${LOCATION}" "${fallback[@]}" \
            --workload "${WORKLOAD}" \
            --param adminUsername="${ADMIN_USERNAME}" \
            --secure-param-env adminPassword=ADMIN_PASSWORD \
            --param sreAgentPrincipalId="${SRE_AGENT_PRINCIPAL_ID}" \
            --outputs-file vm-size-retirement-deployment-outputs.json

          echo "vm_names=$(jq -rc '.vmNames.value' vm-size-retirement-deployment-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "vm_private_ips=$(jq -rc '.vmPrivateIps.value' vm-size-retirement-deployment-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "bastion_name=$(jq -r '.bastionName.value' vm-size-retirement-deployment-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "law_id=$(jq -r '.logAnalyticsWorkspaceId.value' vm-size-retirement-deployment-outputs.json)" >> "$GITHUB_OUTPUT"

      - name: Write deployment summary
        run: |
          {
            echo "## VM Size Retirement infrastructure deployed"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Resource group | \`${RESOURCE_GROUP}\` |"
            echo "| Location | \`${LOCATION}\` |"
            echo "| VM names | \`${{ steps.deploy.outputs.vm_names }}\` |"
            echo "| VM private IPs | \`${{ steps.deploy.outputs.vm_private_ips }}\` |"
            echo "| Bastion host | \`${{ steps.deploy.outputs.bastion_name }}\` |"
            echo "| Log Analytics workspace ID | \`${{ steps.deploy.outputs.law_id }}\` |"
            echo
            echo "Next, [follow the VM Size Retirement scenario guide](${SCENARIO_README})."
          } >> "$GITHUB_STEP_SUMMARY"
