# Publishes the Workload Identity Break scenario container image to GitHub Container Registry.
name: Publish Workload Identity Break Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scenarios/workload-identity-break/src/**'
      - 'scripts/build-artifacts/**'
      - '.github/workflows/publish-workload-identity-break-image.yml'
      # Build triggers follow the scenario's deploy contract so every commit
      # that changes what setup consumes gets an exact-SHA artifact.
      - 'scenarios/workload-identity-break/infra/placement.json'
      - 'scripts/placement/**'

permissions:
  packages: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test artifact metadata
        run: python -m unittest discover -s scripts/build-artifacts -p 'test_*.py'

      - name: Lowercase repository name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: scenarios/workload-identity-break/src/app
          push: true
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Only the immutable SHA tag is pushed here; `latest` moves after the smoke test.
          tags: ghcr.io/${{ steps.repo.outputs.name }}/workload-identity-break/app:${{ github.sha }}

      # No Azure: run the exact pushed digest and require a healthy /health
      # before the image is promoted or trusted metadata is recorded.
      - name: Smoke test the pushed immutable image
        env:
          IMAGE: ghcr.io/${{ steps.repo.outputs.name }}/workload-identity-break/app
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Build did not report an image digest."; exit 1; }
          REF="${IMAGE}@${DIGEST}"
          docker pull "$REF"
          CID=$(docker run --detach --publish 127.0.0.1:3000:3000 "$REF")
          trap 'docker logs "$CID" 2>&1 | tail -n 50 || true; docker rm --force "$CID" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            if BODY=$(curl --fail --silent --show-error http://127.0.0.1:3000/health 2>/dev/null); then
              STATUS=$(printf '%s' "$BODY" | python -c 'import json, sys; print(json.load(sys.stdin).get("status", ""))')
              if [ "$STATUS" = "healthy" ]; then
                echo "Smoke test passed for $REF"
                exit 0
              fi
            fi
            sleep 2
          done
          echo "::error::$REF did not report a healthy /health within 60 seconds."
          exit 1

      - name: Promote latest tag to the smoke-tested digest
        env:
          IMAGE: ghcr.io/${{ steps.repo.outputs.name }}/workload-identity-break/app
          DIGEST: ${{ steps.image.outputs.digest }}
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"

      - name: Record immutable image reference
        env:
          IMAGE: ghcr.io/${{ steps.repo.outputs.name }}/workload-identity-break/app
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          python scripts/build-artifacts/artifact.py metadata \
            --scenario workload-identity-break --variant application \
            --image "$IMAGE" --digest "$DIGEST" --output dist/image/metadata.json

      - uses: actions/upload-artifact@v4
        with:
          name: workload-identity-break-application-${{ github.sha }}
          path: dist/image/metadata.json
          if-no-files-found: error
