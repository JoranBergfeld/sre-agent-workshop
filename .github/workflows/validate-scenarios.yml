name: Validate Scenarios

on:
  push:
    branches:
      - main
    paths:
      - 'README.md'
      - 'schemas/scenario.schema.json'
      - 'scripts/scenario-tools/**'
      - 'scripts/validate-scenarios.sh'
      - '.github/workflows/validate-scenarios.yml'
      - 'scenarios/**'
  pull_request:
    paths:
      - 'README.md'
      - 'schemas/scenario.schema.json'
      - 'scripts/scenario-tools/**'
      - 'scripts/validate-scenarios.sh'
      - '.github/workflows/validate-scenarios.yml'
      - 'scenarios/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scenarios/azure-boards-copilot-handover/app/requirements*.txt

      - name: Install scenario-tools
        working-directory: scripts/scenario-tools
        run: npm ci

      - name: Install Azure Boards handover quality dependencies
        run: pip install -r scenarios/azure-boards-copilot-handover/app/requirements-dev.txt

      - name: Unit tests
        working-directory: scripts/scenario-tools
        run: npm test

      - name: Validate scenarios (schema + drift)
        run: scripts/validate-scenarios.sh
