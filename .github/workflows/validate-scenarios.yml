name: Validate Scenarios

on:
  push:
    branches:
      - main
    paths:
      - 'README.md'
      - 'schemas/legacy-scenario.schema.json'
      - 'schemas/scenario.schema.json'
      - 'scripts/scenario-tools/**'
      - 'scripts/validate-scenarios.sh'
      - '.github/workflows/validate-scenarios.yml'
      - 'scenarios/**'
      - 'workshops/**/scenarios/**'
      - 'workshops/*/README.md'
      - 'workshops/*/infra/bicep/modules/scenario-alerts.bicep'
  pull_request:
    paths:
      - 'README.md'
      - 'schemas/legacy-scenario.schema.json'
      - 'schemas/scenario.schema.json'
      - 'scripts/scenario-tools/**'
      - 'scripts/validate-scenarios.sh'
      - '.github/workflows/validate-scenarios.yml'
      - 'scenarios/**'
      - 'workshops/**/scenarios/**'
      - 'workshops/*/README.md'
      - 'workshops/*/infra/bicep/modules/scenario-alerts.bicep'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install scenario-tools
        working-directory: scripts/scenario-tools
        run: npm ci

      - name: Unit tests
        working-directory: scripts/scenario-tools
        run: npm test

      - name: Validate scenarios (schema + drift)
        run: scripts/validate-scenarios.sh

      - name: Set up Bicep
        run: az bicep install

      - name: Build validated scenario artifacts
        run: |
          set -euo pipefail
          declare -A built_mains=()
          declare -A built_bicep_files=()

          if [ -d scenarios ]; then
            while IFS= read -r -d '' manifest; do
              scenario_dir="$(dirname "$manifest")"
              main_bicep="$scenario_dir/infra/bicep/main.bicep"
              if [ ! -f "$main_bicep" ]; then
                echo "::error file=$manifest::Missing Bicep entry point: $main_bicep"
                exit 1
              fi
              if [[ -z "${built_mains["$main_bicep"]+x}" ]]; then
                built_mains["$main_bicep"]=1
                built_bicep_files["$main_bicep"]=1
              fi
              alert_module="$scenario_dir/infra/bicep/modules/alert.bicep"
              if [ -f "$alert_module" ]; then
                built_bicep_files["$alert_module"]=1
              fi
            done < <(find scenarios -mindepth 2 -maxdepth 2 -name scenario.yaml -print0)
          fi

          # Legacy workshop coverage stays discovery-based so the current set of
          # alert bicep files, aggregators, and the standalone service-health
          # template are built without hardcoding a count.
          for pattern in \
            'workshops/*/scenarios/*/alert.bicep' \
            'workshops/*/infra/bicep/modules/scenario-alerts.bicep' \
            'workshops/*/scenarios/*/service-health-alert.bicep'; do
            for bicep_file in $pattern; do
              [ -e "$bicep_file" ] || continue
              built_bicep_files["$bicep_file"]=1
            done
          done

          printf '%s\n' "${!built_mains[@]}" "${!built_bicep_files[@]}" | sort -u | while IFS= read -r bicep_file; do
            [ -n "$bicep_file" ] || continue
            echo "Building $bicep_file"
            az bicep build --file "$bicep_file" --stdout > /dev/null
          done
