name: Validate Scenarios

on:
  push:
    paths:
      - 'scenarios/**'
      - 'README.md'
      - 'schemas/scenario.schema.json'
      - 'scripts/scenario-tools/**'
      # Temporary migration support: remove after the legacy validator and workshop scenarios are retired.
      - 'workshops/**/scenarios/**'
      - 'schemas/legacy-scenario.schema.json'
  pull_request:
    paths:
      - 'scenarios/**'
      - 'README.md'
      - 'schemas/scenario.schema.json'
      - 'scripts/scenario-tools/**'
      # Temporary migration support: remove after the legacy validator and workshop scenarios are retired.
      - 'workshops/**/scenarios/**'
      - 'schemas/legacy-scenario.schema.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install scenario-tools
        working-directory: scripts/scenario-tools
        run: npm ci

      - name: Unit tests
        working-directory: scripts/scenario-tools
        run: npm test

      - name: Validate scenarios (schema + drift)
        run: scripts/validate-scenarios.sh

      - name: Set up Bicep
        run: az bicep install

      - name: Build all scenario + aggregator bicep
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in scenarios/*/infra/bicep/main.bicep scenarios/*/infra/bicep/modules/alert.bicep; do
            echo "Building $f"
            az bicep build --file "$f" --stdout > /dev/null
          done
          # Temporary migration support: remove once the legacy workshop scenarios and validator are gone.
          for f in workshops/*/scenarios/*/alert.bicep workshops/*/infra/bicep/modules/scenario-alerts.bicep; do
            echo "Building $f"
            az bicep build --file "$f" --stdout > /dev/null
          done
