name: Deploy App Service Application

on:
  push:
    branches: [main]
    paths:
      - 'scenarios/cloud-agent-handover/src/**'
      - 'scenarios/cloud-agent-handover/tests/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test application
        run: dotnet test scenarios/cloud-agent-handover/tests/HandoverApp.Tests.csproj

      - name: Publish application
        run: dotnet publish scenarios/cloud-agent-handover/src/HandoverApp.csproj --configuration Release --output publish

      - name: Create deployment archive
        working-directory: publish
        run: zip -r "$GITHUB_WORKSPACE/app.zip" .

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy application
        run: |
          az webapp deploy \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --src-path app.zip \
            --type zip \
            --output none
