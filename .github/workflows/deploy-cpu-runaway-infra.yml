name: Deploy CPU Runaway Infrastructure

on:
  workflow_dispatch:
    inputs:
      location:
        description: 'Preferred Azure region (fallback order: infra/placement.json)'
        type: choice
        options:
          - eastus2
          - swedencentral
          - australiaeast
        default: eastus2
      regionFallback:
        description: 'Fall back to the next supported region when the preferred one lacks capacity, SKUs or quota (never for an existing deployment)'
        type: boolean
        default: true
      workloadName:
        description: 'Workload name'
        type: string
        default: srelabcpurunaway
      adminUsername:
        description: 'Windows VM admin username'
        type: string
        default: azureuser

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SCENARIO_ROOT: scenarios/cpu-runaway
      LOCATION: ${{ inputs.location || vars.AZURE_LOCATION || 'eastus2' }}
      WORKLOAD: ${{ inputs.workloadName || vars.WORKLOAD_NAME || 'srelabcpurunaway' }}
      ADMIN_USERNAME: ${{ inputs.adminUsername || 'azureuser' }}
      ADMIN_PASSWORD: ${{ secrets.VM_ADMIN_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate VM admin password secret
        run: |
          if [ -z "${ADMIN_PASSWORD}" ]; then
            echo "::error::Missing repository secret VM_ADMIN_PASSWORD"
            exit 1
          fi

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Node.js for the placement engine
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy CPU Runaway Bicep template (region and SKU fallback)
        id: deploy
        env:
          REGION_FALLBACK: ${{ inputs.regionFallback && 'true' || 'false' }}
        run: |
          # Placement policy: scenarios/cpu-runaway/infra/placement.json. An existing
          # resource group stays pinned to its recorded region; only verified
          # attempt-owned resources are cleaned up after a failed attempt.
          fallback=()
          if [ "${REGION_FALLBACK}" != "true" ]; then fallback=(--no-region-fallback); fi
          node scripts/placement/provision.mjs deploy cpu-runaway \
            --location "${LOCATION}" "${fallback[@]}" \
            --workload "${WORKLOAD}" \
            --param adminUsername="${ADMIN_USERNAME}" \
            --secure-param-env adminPassword=ADMIN_PASSWORD \
            --outputs-file deployment-outputs.json

          cat deployment-outputs.json
          echo "vm_names=$(jq -rc '.vmNames.value' deployment-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "vm_computer_names=$(jq -rc '.vmComputerNames.value' deployment-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "vm_private_ips=$(jq -rc '.vmPrivateIps.value' deployment-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "law_id=$(jq -r '.logAnalyticsWorkspaceId.value' deployment-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "appinsights_cs=$(jq -r '.appInsightsConnectionString.value' deployment-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "operations_identity_client_id=$(jq -r '.operationsIdentityClientId.value' deployment-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "bastion_name=$(jq -r '.bastionName.value' deployment-outputs.json)" >> "$GITHUB_OUTPUT"

      - name: Print deployment summary
        run: |
          echo "============================================"
          echo "  CPU Runaway Infrastructure Deployment Complete"
          echo "============================================"
          echo "Resource Group:          ${{ steps.deploy.outputs.resource_group }}"
          echo "Location:                ${{ steps.deploy.outputs.location }}"
          echo "VM size:                 ${{ steps.deploy.outputs.sku }}"
          echo "VM Names:                ${{ steps.deploy.outputs.vm_names }}"
          echo "VM Computer Names:       ${{ steps.deploy.outputs.vm_computer_names }}"
          echo "VM Private IPs:          ${{ steps.deploy.outputs.vm_private_ips }}"
          echo "Bastion Host:            ${{ steps.deploy.outputs.bastion_name }}"
          echo "Log Analytics ID:        ${{ steps.deploy.outputs.law_id }}"
          echo "App Insights CS:         ${{ steps.deploy.outputs.appinsights_cs }}"
          echo "Operations Identity ID:  ${{ steps.deploy.outputs.operations_identity_client_id }}"
          echo "============================================"
          echo ""
          echo "Next: follow scenarios/cpu-runaway/README.md."
